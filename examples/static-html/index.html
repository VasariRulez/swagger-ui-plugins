<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swagger UI with Plugins Suite</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
</head>
<body>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>

    <script>
        window.onload = function() {
            window.ui = SwaggerUIBundle({
                url: "https://petstore.swagger.io/v2/swagger.json",
                dom_id: '#swagger-ui',
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                layout: "StandaloneLayout"
            });
        };
    </script>

    <!-- Optional Global i18n Configuration (Overrides, Custom Locales, Initial Locale) -->
    <script>
        window.SwaggerI18nConfig = {
            locale: "en", // "en" | "it" (persisted across reloads in localStorage; switchable live via Activity Bar 🌐)
            autoDetect: true, // auto-detect from <html lang="..."> if no preference is saved in localStorage
            messages: {
                // Host overrides can be added here
            }
        };
    </script>

    <!-- Optional Flow Runner Configuration (Predefined Scenarios) -->
    <script>
        window.SwaggerFlowRunnerConfig = {
            activityBarOrder: 35,
            defaultDelayMs: 250,
            stopOnError: true,
            scenarios: [
                {
                    id: "demo-petstore-flow",
                    name: "Demo: Add Pet & Find by ID",
                    description: "Adds a new pet to the store and queries it using the extracted ID.",
                    steps: [
                        {
                            id: "step-1",
                            name: "1. Add New Pet",
                            method: "POST",
                            path: "/v2/pet",
                            inheritAuth: false,
                            body: JSON.stringify({
                                name: "Fluffy",
                                photoUrls: ["https://example.com/cat.jpg"],
                                status: "available"
                            }, null, 2),
                            extractions: [
                                { jsonPath: "id", varName: "petId" }
                            ]
                        },
                        {
                            id: "step-2",
                            name: "2. Get Pet by ID",
                            method: "GET",
                            path: "/v2/pet/{{petId}}",
                            inheritAuth: false
                        }
                    ]
                }
            ]
        };
    </script>

    <!-- Plugins Suite -->
    <script src="../../plugins/activity-bar/swagger-activity-bar.js"></script>
    <script src="../../plugins/spotlight-search/swagger-spotlight-search.js"></script>
    <script src="../../plugins/network-history/swagger-network-history.js"></script>
    <script src="../../plugins/pretty-json-view/swagger-pretty-json-view.js"></script>
    <script src="../../plugins/data-grid-view/swagger-data-grid-view.js"></script>
    <script src="../../plugins/dto-presets/swagger-dto-presets.js"></script>
    <script src="../../plugins/jwt-inspector/swagger-jwt-inspector.js"></script>
    <script src="../../plugins/signalr-tester/signalr.min.js"></script>
    <script src="../../plugins/signalr-tester/swagger-signalr-tester.js"></script>
    <script src="../../plugins/flow-runner/swagger-flow-runner.js"></script>
</body>
</html>
